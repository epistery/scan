<style>
    .nav-panel {
        position: relative;
        width: 200px;
        height: 100%;
        background: #fff;
        border-right: 1px solid #e8e8e8;
        z-index: 1000;
        padding: 1rem;
        box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        overflow: hidden;
    }

    /* Hamburger is hidden on desktop; the sidebar is always visible there. */
    .nav-hamburger {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1002;
        width: 40px;
        height: 40px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        cursor: pointer;
    }
    .nav-hamburger span {
        display: block;
        width: 20px;
        height: 2px;
        background: #2c3e50;
    }

    .nav-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 999;
    }
    .nav-backdrop[hidden] { display: none; }

    @media (max-width: 720px) {
        .nav-hamburger { display: flex; }

        /* Sidebar becomes a slide-in drawer from the left. Uses transform so it
           animates and stays measurable for screen readers while closed. */
        .nav-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            height: auto;
            width: min(80vw, 260px);
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.2s ease;
        }
        .nav-panel.open { transform: translateX(0); }

        /* Center the ball logo in the wider mobile drawer */
        .home-logo-wrap { margin-left: auto !important; margin-right: auto; }

        /* The watermark is oversized (300%) for the disabled swirl animation.
           overflow-y:auto here would treat it as scrollable content, so pin it
           to the panel's own box — no phantom scroll. */
        .nav-panel::before { top: 0; left: 0; width: 100%; height: 100%; }
    }

    .nav-panel a {
        display: block;
        padding: 0.6rem 0.5rem;
        color: #2c3e50;
        text-decoration: none;
        font-size: 0.95rem;
        border-radius: 4px;
    }
    .nav-panel a:hover { background: #f0f4f8; }
    .nav-panel a.active { font-weight: 600; color: #3498db; }
    .nav-panel hr {
        border: none;
        border-top: 1px solid #e8e8e8;
        margin: 0.5rem 0.5rem;
    }
    .nav-panel::before {
        content: '';
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background-image: url('/static/image/epistery-base-1000.png');
        background-size: var(--pattern-size, 1000px) var(--pattern-size, 1000px);
        background-position: center;
        background-repeat: repeat;
        opacity: 0.08;
        /*animation: patternSwirl 220s ease-in-out infinite;*/
        pointer-events: none;
        z-index: 0;
        zoom: 3;
        transition: background-size 0.15s ease-out;
    }
    .home-logo-wrap {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid var(--rust-deep);
        margin-bottom: 2rem;
        margin-left:1.1rem;
    }
    .home-logo-wrap img {
        width: 128px;
        height: 128px;
        object-fit: cover;
    }
    .menu-subtext {
        margin-left: 1rem;
        font-size: 0.8rem;
        opacity: 0.7;
    }
</style>

<button id="navHamburger" class="nav-hamburger" type="button" aria-label="Open menu" aria-controls="navPanel" aria-expanded="false">
    <span></span><span></span><span></span>
</button>
<div id="navBackdrop" class="nav-backdrop" hidden></div>

<div id="navPanel" class="nav-panel">
    <div class="home-logo-wrap">
        <a href="/"><img alt="epistery logo" src="/static/image/epistery-logo-64.svg"/></a>
    </div>
    <div class="nav-menu">
        <a href="/">Search</a>
        <a href="/discovery">Discovery</a>
        <a href="/tools">MCP Tools</a>
        <hr>
        <a href="https://epistery.app" target="_blank">Epistery App</a>
        <div class="menu-subtext">personal data wallet</div>
        <a href="https://epistery.host" target="_blank">Epistery Host</a>
        <div class="menu-subtext">domain services contract</div>
        <a href="https://rootz.global" target="_blank">Rootz</a>
        <div class="menu-subtext">knowledge starts at origin</div>
        <hr>
        <a href="/about">About</a>
        <a href="/developers">Developers</a>
    </div>
</div>
